# Packages vendored into this monorepo as git subtrees.
#
# `path` is where the package lives in this repo. `upstream` is the
# standalone repo it is synced from while the monorepo is being evaluated.
# `tools/subtree.sh` reads this file.
#
# `owners` feeds .github/CODEOWNERS (`julia tools/mono.jl codeowners`).
# Initial values are proposals derived from who reviewed/authored merged PRs
# in each standalone repo, 2025-09-28 → 2026-09-28; see docs/OWNERSHIP.md.
# Prefer GitHub teams (@CliMA/<team>) once they exist.
#
# Excluded on purpose (high independent traffic / separate communities):
# Oceananigans, ClimaOcean, ClimaSeaIce, EnsembleKalmanProcesses.

# Owners of repo-wide infrastructure (tools/, CI, workspace, this file).
[_repo]
owners = ["@CliMA/software"]
team = "software"

# One GitHub Project (kanban board) per team. `project` is the org project
# number (0 = not created yet; triage then only labels). Issues and PRs are
# routed by package label; see docs/OWNERSHIP.md.
[_teams]
core = {project = 0, name = "Core infrastructure"}
physics = {project = 0, name = "Physics parameterizations"}
atmos = {project = 0, name = "Atmosphere"}
land = {project = 0, name = "Land"}
coupler = {project = 0, name = "Coupler & experiments"}
calibration = {project = 0, name = "Calibration"}
software = {project = 0, name = "Software & infrastructure"}

[dev-guides]
path = "docs/dev"
upstream = "https://github.com/CliMA/DeveloperGuides.git"
branch = "main"
owners = ["@imreddyTeja", "@tapios"]
team = "software"
julia = false

