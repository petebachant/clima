# Runs .pre-commit-config.yaml on every PR (adopted from ClimaAtmos).
name: Prek checks
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
      - uses: j178/prek-action@v2
