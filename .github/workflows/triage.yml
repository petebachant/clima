# Route issues and PRs to the owning team.
#
# 1. Label: issues get the label chosen in the issue form's "Package"
#    dropdown; PRs get one label per area their changed files touch.
# 2. Route: every labeled item is added to its team's GitHub Project (kanban
#    board), per .github/triage.json (generated from packages.toml by
#    `julia tools/mono.jl codeowners`).
#
# Both happen in one job on purpose: labels added with GITHUB_TOKEN don't
# trigger other workflows, so a separate "on labeled" workflow would never
# see them. Relabeling an issue by hand does trigger this, so moving an issue
# to another package also adds it to that team's board.
#
# Setup: create one org project per team and put its number in packages.toml
# [_teams]; add a PROJECTS_TOKEN secret (GitHub App or fine-grained PAT with
# org Projects read/write). Without the token, items are only labeled.
name: Triage
on:
  issues:
    types: [opened, edited, labeled]
  pull_request_target:  # base-branch code only; PR code is never checked out
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # base branch: trusted triage.json
      - uses: actions/github-script@v7
        env:
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        with:
          script: |
            const fs = require('fs');
            const map = JSON.parse(fs.readFileSync('.github/triage.json', 'utf8'));
            const byLabel = Object.fromEntries(map.areas.map(a => [a.label, a]));
            const { owner, repo } = context.repo;
            const item = context.payload.issue || context.payload.pull_request;
            const isPR = !!context.payload.pull_request;

            // 1. Labels this item should have.
            const want = new Set();
            if (isPR) {
              const files = await github.paginate(github.rest.pulls.listFiles,
                { owner, repo, pull_number: item.number, per_page: 100 });
              for (const f of files)
                for (const a of map.areas)
                  if (a.paths.some(p => f.filename === p || f.filename.startsWith(p)))
                    want.add(a.label);
            } else {
              const m = (item.body || '').match(/### Package\s+([^\n]+)/);
              if (m && byLabel[m[1].trim()]) want.add(m[1].trim());
            }
            const have = new Set(item.labels.map(l => l.name));
            const add = [...want].filter(l => !have.has(l));
            if (add.length)
              await github.rest.issues.addLabels({ owner, repo, issue_number: item.number, labels: add });

            // 2. Route to each team's project.
            const labels = new Set([...have, ...want]);
            const teams = new Set([...labels].filter(l => byLabel[l]).map(l => byLabel[l].team));
            core.summary.addRaw(`Labels: ${[...labels].join(', ') || '(none)'}\nTeams: ${[...teams].join(', ') || '(none)'}\n`);
            if (!process.env.PROJECTS_TOKEN) {
              core.notice('PROJECTS_TOKEN not set; labeled only.');
              return core.summary.write();
            }
            const { graphql } = require('@octokit/graphql');
            const gql = graphql.defaults({ headers: { authorization: `token ${process.env.PROJECTS_TOKEN}` } });
            for (const t of teams) {
              const number = map.teams[t]?.project;
              if (!number) { core.notice(`team ${t} has no project yet`); continue; }
              const { organization } = await gql(
                `query($org:String!,$n:Int!){organization(login:$org){projectV2(number:$n){id}}}`,
                { org: owner, n: number });
              // Idempotent: returns the existing item if already on the board.
              await gql(`mutation($p:ID!,$c:ID!){addProjectV2ItemById(input:{projectId:$p,contentId:$c}){item{id}}}`,
                { p: organization.projectV2.id, c: item.node_id });
              core.info(`added to ${map.teams[t].name} (project ${number})`);
            }
            await core.summary.write();
